# Builds adminer-VERSION-x64.exe from this repository and has SignPath sign it, which verifies that the exe comes from this workflow
name: Build Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: Adminer version, the latest release if empty
        required: false
      signing-policy:
        description: SignPath signing policy, test-signing uses a test certificate
        type: choice
        options:
          - test-signing
          - release-signing
permissions:
  actions: read # SignPath downloads the unsigned artifact
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: openssl, zip
          tools: none
      - run: php build.php $VERSION windows
        env:
          VERSION: ${{ inputs.version }} # passed through the environment, not pasted into the script
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: adminer-windows
          path: dist/adminer-*.exe
          retention-days: 7
      - uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 104c5fa7-31f4-4ac7-97e8-8aeb98e55770
          project-slug: adminer
          signing-policy-slug: ${{ inputs.signing-policy }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600 # release-signing waits for the manual approval
          output-artifact-directory: dist/signed
      - uses: actions/upload-artifact@v7
        with:
          name: adminer-windows-signed
          path: dist/signed/adminer-*.exe
          retention-days: 7
