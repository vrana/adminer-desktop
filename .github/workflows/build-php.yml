# Builds the static PHP for the platforms which need their own machine; build-php-github.php starts it and downloads the artifacts into cache/
name: Build PHP
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: windows-2022 # has Visual Studio, which static-php-cli needs on Windows
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: sh build-php.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.platform }}
          path: cache/static-php/${{ matrix.platform }}/
          retention-days: 7
