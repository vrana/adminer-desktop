# Builds the static PHP for macOS, which needs a Mac; mac/build-php.php starts it and downloads the artifact into cache/
name: Build PHP
on: workflow_dispatch
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sh build-php.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: php-macos-arm64
          path: cache/static-php/macos-arm64/
          retention-days: 7
